<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>digiKam Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%234285f4'/%3E%3Cpath fill='white' d='M8.5 13.5l2.5 3 3.5-4.5 4.5 6H5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/photos" title="All photos"><span class="logo"></span><span class="brand-name">digiKam Viewer</span></a>
  <div id="search">
    <div id="searchbox">
      <span class="ic" data-ic="search"></span>
      <div id="chips"></div>
      <input id="q" type="text" placeholder="Search people, tags, albums, cameras, captions…" autocomplete="off" spellcheck="false">
      <button id="clear" class="iconbtn" title="Clear search" hidden><span class="ic" data-ic="close"></span></button>
    </div>
    <div id="suggest" hidden></div>
  </div>
  <button id="filterbtn" class="pillbtn" title="Browse and filter by any metadata"><span class="ic" data-ic="tune"></span><span>Filters</span></button>
  <a class="iconbtn tool" href="#/settings" data-v="settings" title="Settings"><span class="ic" data-ic="tune"></span></a>
  <a class="iconbtn tool" href="#/maintenance" data-v="maintenance" title="Maintenance"><span class="ic" data-ic="wrench"></span></a>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<aside id="filters" hidden></aside>
<div id="lightbox" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
